<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0e13">
    <title>📱 移動端測試頁面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0e13;
            color: #e0e3e7;
            padding: 1rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            color: #00ff88;
            margin-bottom: 2rem;
            font-size: 1.5rem;
        }

        .section {
            background: #0f1419;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            border: 1px solid #1a1f26;
        }

        h2 {
            color: #00ff88;
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        .info {
            background: #1a1f26;
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-family: monospace;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #2a2f36;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .label {
            color: #8b8e93;
        }

        .value {
            color: #00ff88;
            font-weight: bold;
        }

        .btn {
            display: block;
            width: 100%;
            background: #00ff88;
            color: #0a0e13;
            border: none;
            padding: 1rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            margin: 0.5rem 0;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        .btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid #00ff88;
            color: #00ff88;
        }

        .status {
            padding: 0.5rem 1rem;
            border-radius: 4px;
            margin: 0.5rem 0;
            font-weight: 600;
        }

        .status.pass {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border: 1px solid #00ff88;
        }

        .status.fail {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            border: 1px solid #ff4444;
        }

        .checklist {
            list-style: none;
        }

        .checklist li {
            padding: 0.75rem;
            margin: 0.5rem 0;
            background: #1a1f26;
            border-radius: 4px;
        }

        .checklist li::before {
            content: '☐ ';
            color: #8b8e93;
            margin-right: 0.5rem;
        }

        .emoji {
            font-size: 1.5rem;
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><span class="emoji">📱</span>移動端響應式測試</h1>

        <div class="section">
            <h2>設備信息</h2>
            <div class="info">
                <div class="info-item">
                    <span class="label">屏幕寬度</span>
                    <span class="value" id="screenWidth">--</span>
                </div>
                <div class="info-item">
                    <span class="label">屏幕高度</span>
                    <span class="value" id="screenHeight">--</span>
                </div>
                <div class="info-item">
                    <span class="label">視口寬度</span>
                    <span class="value" id="viewportWidth">--</span>
                </div>
                <div class="info-item">
                    <span class="label">視口高度</span>
                    <span class="value" id="viewportHeight">--</span>
                </div>
                <div class="info-item">
                    <span class="label">設備像素比</span>
                    <span class="value" id="pixelRatio">--</span>
                </div>
                <div class="info-item">
                    <span class="label">屏幕方向</span>
                    <span class="value" id="orientation">--</span>
                </div>
                <div class="info-item">
                    <span class="label">觸摸支持</span>
                    <span class="value" id="touchSupport">--</span>
                </div>
                <div class="info-item">
                    <span class="label">用戶代理</span>
                    <span class="value" id="userAgent" style="font-size: 0.8rem; word-break: break-all;">--</span>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>響應式斷點檢測</h2>
            <div id="breakpointStatus"></div>
        </div>

        <div class="section">
            <h2>功能測試</h2>
            <ul class="checklist">
                <li id="test1">漢堡菜單顯示正常</li>
                <li id="test2">側邊欄可以打開/關閉</li>
                <li id="test3">觸摸目標大小 ≥ 44px</li>
                <li id="test4">圖表自動適應大小</li>
                <li id="test5">橫豎屏切換流暢</li>
                <li id="test6">滾動平滑無卡頓</li>
            </ul>
        </div>

        <div class="section">
            <h2>打開測試頁面</h2>
            <a href="index.html" class="btn">原版 (Binance API)</a>
            <a href="index-tradingview.html" class="btn">TradingView 版本 (推薦)</a>
            <a href="test.html" class="btn btn-secondary">API 連接測試</a>
        </div>

        <div class="section">
            <h2>建議</h2>
            <div class="info">
                <p id="recommendation" style="color: #e0e3e7; line-height: 1.6;"></p>
            </div>
        </div>
    </div>

    <script>
        // 更新設備信息
        function updateDeviceInfo() {
            document.getElementById('screenWidth').textContent = screen.width + 'px';
            document.getElementById('screenHeight').textContent = screen.height + 'px';
            document.getElementById('viewportWidth').textContent = window.innerWidth + 'px';
            document.getElementById('viewportHeight').textContent = window.innerHeight + 'px';
            document.getElementById('pixelRatio').textContent = window.devicePixelRatio;
            document.getElementById('orientation').textContent =
                window.innerWidth > window.innerHeight ? '橫屏 (Landscape)' : '豎屏 (Portrait)';
            document.getElementById('touchSupport').textContent =
                'ontouchstart' in window ? '✅ 支持' : '❌ 不支持';
            document.getElementById('userAgent').textContent = navigator.userAgent;
        }

        // 檢測響應式斷點
        function checkBreakpoint() {
            const width = window.innerWidth;
            let breakpoint = '';
            let status = '';

            if (width < 480) {
                breakpoint = '超小屏手機';
                status = 'pass';
            } else if (width < 768) {
                breakpoint = '標準手機';
                status = 'pass';
            } else if (width < 968) {
                breakpoint = '平板/大屏手機';
                status = 'pass';
            } else if (width < 1200) {
                breakpoint = '小筆記本';
                status = 'pass';
            } else {
                breakpoint = '桌面電腦';
                status = 'pass';
            }

            document.getElementById('breakpointStatus').innerHTML =
                `<div class="status ${status}">當前斷點：${breakpoint} (${width}px)</div>`;
        }

        // 提供建議
        function provideRecommendation() {
            const width = window.innerWidth;
            const isTouch = 'ontouchstart' in window;
            let recommendation = '';

            if (width < 768 && isTouch) {
                recommendation = '✅ 您的設備非常適合測試移動端！建議測試漢堡菜單、觸摸操作和橫豎屏切換。';
            } else if (width < 968) {
                recommendation = '📱 平板設備，建議測試橫豎屏模式下的佈局變化。';
            } else {
                recommendation = '💻 桌面設備，建議調整瀏覽器窗口大小來模擬不同的移動設備。按 F12 打開開發者工具，使用設備模擬器。';
            }

            document.getElementById('recommendation').textContent = recommendation;
        }

        // 初始化
        updateDeviceInfo();
        checkBreakpoint();
        provideRecommendation();

        // 監聽窗口大小變化
        window.addEventListener('resize', function() {
            updateDeviceInfo();
            checkBreakpoint();
            provideRecommendation();
        });

        // 監聽方向變化
        window.addEventListener('orientationchange', function() {
            setTimeout(() => {
                updateDeviceInfo();
                checkBreakpoint();
            }, 100);
        });

        console.log('📱 Mobile test page loaded');
        console.log('Screen:', screen.width, 'x', screen.height);
        console.log('Viewport:', window.innerWidth, 'x', window.innerHeight);
    </script>
</body>
</html>
